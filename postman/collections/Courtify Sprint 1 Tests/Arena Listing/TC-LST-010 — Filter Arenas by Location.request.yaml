$kind: http-request
name: 'TC-LST-010 — Filter Arenas by Location'
method: GET
url: '{{base_url}}/arenas'
order: 10000
queryParams:
  - key: location
    value: Lahore
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-LST-010: Status is 200", () => pm.response.to.have.status(200));
      pm.test("TC-LST-010: Response is an array", () => {
          const json = pm.response.json();
          pm.expect(json).to.be.an("array");
      });
