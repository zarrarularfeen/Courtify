$kind: http-request
name: 'TC-LST-004 — Get Arena by ID'
method: GET
url: '{{base_url}}/arenas/1'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-LST-004: Status is 200", () => pm.response.to.have.status(200));
      pm.test("TC-LST-004: Response contains arena details", () => {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("name");
      });
