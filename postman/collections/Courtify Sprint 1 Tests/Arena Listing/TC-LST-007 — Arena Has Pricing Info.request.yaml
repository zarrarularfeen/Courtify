$kind: http-request
name: 'TC-LST-007 — Arena Has Pricing Info'
method: GET
url: '{{base_url}}/arenas/1'
order: 7000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-LST-007: Status is 200", () => pm.response.to.have.status(200));
      pm.test("TC-LST-007: Arena has pricing info", () => {
          const json = pm.response.json();
          pm.expect(json).to.satisfy(body =>
              body.hasOwnProperty("price") || body.hasOwnProperty("pricing") || body.hasOwnProperty("pricePerHour")
          );
      });
