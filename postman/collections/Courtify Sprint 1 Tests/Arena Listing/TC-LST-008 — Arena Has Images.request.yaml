$kind: http-request
name: 'TC-LST-008 — Arena Has Images'
method: GET
url: '{{base_url}}/arenas/1'
order: 8000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-LST-008: Status is 200", () => pm.response.to.have.status(200));
      pm.test("TC-LST-008: Arena has images field", () => {
          const json = pm.response.json();
          pm.expect(json).to.satisfy(body =>
              body.hasOwnProperty("images") || body.hasOwnProperty("photos") || body.hasOwnProperty("imageUrl")
          );
      });
