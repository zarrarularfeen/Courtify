$kind: http-request
name: 'TC-LST-006 — Arena Has Sports Field'
method: GET
url: '{{base_url}}/arenas/1'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-LST-006: Status is 200", () => pm.response.to.have.status(200));
      pm.test("TC-LST-006: Arena has sports field", () => {
          const json = pm.response.json();
          pm.expect(json).to.have.property("sports");
          pm.expect(json.sports).to.be.an("array");
      });
