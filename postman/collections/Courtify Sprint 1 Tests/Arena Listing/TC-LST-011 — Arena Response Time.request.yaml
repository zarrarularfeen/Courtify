$kind: http-request
name: 'TC-LST-011 — Arena Response Time'
method: GET
url: '{{base_url}}/arenas'
order: 11000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-LST-011: Status is 200", () => pm.response.to.have.status(200));
      pm.test("TC-LST-011: Response time is under 2000ms", () => {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });
