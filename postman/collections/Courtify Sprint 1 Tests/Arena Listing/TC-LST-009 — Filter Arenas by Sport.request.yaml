$kind: http-request
name: 'TC-LST-009 — Filter Arenas by Sport'
method: GET
url: '{{base_url}}/arenas'
order: 9000
queryParams:
  - key: sport
    value: cricket
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-LST-009: Status is 200", () => pm.response.to.have.status(200));
      pm.test("TC-LST-009: Response is an array", () => {
          const json = pm.response.json();
          pm.expect(json).to.be.an("array");
      });
