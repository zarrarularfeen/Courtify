$kind: http-request
name: 'TC-OWN-001 — Valid Arena Creation'
method: POST
url: '{{base_url}}/arenas'
order: 1000
headers:
  - key: Content-Type
    value: application/json
  - key: Authorization
    value: 'Bearer {{owner_token}}'
body:
  type: json
  content: |-
    {
      "name": "Test Arena",
      "location": "Lahore",
      "sports": ["cricket", "football"],
      "pricePerHour": 1500,
      "description": "A test arena for automated testing"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-OWN-001: Status is 201", () => pm.response.to.have.status(201));
      pm.test("TC-OWN-001: Response contains created arena", () => {
          const json = pm.response.json();
          pm.expect(json).to.have.property("id");
          pm.expect(json).to.have.property("name");
      });
      if (pm.response.code === 201) {
          const json = pm.response.json();
          pm.collectionVariables.set("created_arena_id", json.id);
      }
