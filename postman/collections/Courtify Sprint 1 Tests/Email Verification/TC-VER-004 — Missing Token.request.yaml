$kind: http-request
name: 'TC-VER-004 — Missing Token'
method: GET
url: '{{base_url}}/auth/verify-email'
order: 4000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-VER-004: Status is 400", () => pm.response.to.have.status(400));
      pm.test("TC-VER-004: Response contains missing token error", () => {
          const body = pm.response.text();
          pm.expect(body).to.match(/token.*required|missing.*token|no.*token/i);
      });
