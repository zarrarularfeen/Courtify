$kind: http-request
name: 'TC-VER-002 — Invalid Token'
method: GET
url: '{{base_url}}/auth/verify-email'
order: 2000
queryParams:
  - key: token
    value: invalid_token_xyz
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-VER-002: Status is 400", () => pm.response.to.have.status(400));
      pm.test("TC-VER-002: Response contains invalid token error", () => {
          const body = pm.response.text();
          pm.expect(body).to.match(/invalid.*token|token.*invalid|token.*expired/i);
      });
