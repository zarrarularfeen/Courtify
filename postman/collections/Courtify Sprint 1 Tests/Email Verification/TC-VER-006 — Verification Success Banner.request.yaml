$kind: http-request
name: 'TC-VER-006 — Verification Success Banner (Frontend)'
method: GET
url: '{{base_url}}/arenas'
order: 6000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-VER-006: This test verifies the frontend success banner shown after email verification.
      // The React frontend at http://localhost:5173/?verified=1&type=player shows an
      // "Email verified! You can now log in." banner — this must be verified manually in a browser.
      // The automated check below confirms the backend is reachable as a proxy for system health.
      pm.test("TC-VER-006: Backend is reachable (frontend check is manual)", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 204]);
      });

      pm.test("TC-VER-006: MANUAL — Open http://localhost:5173/?verified=1&type=player to verify success banner", function () {
          // This test always passes — open the URL above in a browser to confirm the UI banner.
          pm.expect(true).to.be.true;
      });

      console.log("TC-VER-006: Manually verify the success banner at http://localhost:5173/?verified=1&type=player");
