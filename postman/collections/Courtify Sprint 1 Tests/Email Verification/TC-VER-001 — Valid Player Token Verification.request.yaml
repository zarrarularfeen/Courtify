$kind: http-request
name: 'TC-VER-001 — Valid Player Token Verification'
method: GET
url: '{{base_url}}/auth/verify'
order: 1000
queryParams:
  - key: token
    value: 'valid_token_here'
    description: 'Paste a valid 64-char hex token from players.verification_token in DB'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-VER-001: Status is 302 Redirect (or 200)", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
      pm.test("TC-VER-001: NOTE — After redirect, DB should show is_active=1 and verification_token=NULL for player", function () {
          // Expected redirect target: /?verified=1&type=player
          // Manual DB check: SELECT is_active, verification_token FROM players WHERE email='newplayer@test.com'
          pm.expect(true).to.be.true;
      });
