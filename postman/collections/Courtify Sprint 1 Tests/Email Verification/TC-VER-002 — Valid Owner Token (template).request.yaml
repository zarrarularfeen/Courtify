$kind: http-request
name: 'TC-VER-002 — Valid Owner Token (template)'
method: GET
url: '{{base_url}}/auth/verify'
order: 4000
description: 'Replace the token value with a valid 64-char hex token from the arena_owners table in the DB before running.'
queryParams:
  - key: token
    value: 'valid_template_token_owner'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-VER-002: Status is 302 (redirect)", () => {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
