$kind: http-request
name: 'TC-REG-001 — Valid Player Signup'
method: POST
url: '{{base_url}}/auth/signup'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Ali Khan",
      "email": "newplayer_{{$timestamp}}@test.com",
      "phone": "03001234567",
      "password": "Pass@1234",
      "userType": "player"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-REG-001: Status is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("TC-REG-001: Response contains success message", function () {
          const json = pm.response.json();
          pm.expect(json.error || json.message).to.include("Account created");
      });
      pm.test("TC-REG-001: Response body is JSON", function () {
          pm.response.to.be.json;
      });
