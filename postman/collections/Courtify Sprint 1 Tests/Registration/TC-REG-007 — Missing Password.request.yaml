$kind: http-request
name: 'TC-REG-007 — Missing Password'
method: POST
url: '{{base_url}}/auth/signup'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "x@test.com",
      "userType": "player"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-REG-007: Status is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });
      pm.test("TC-REG-007: Error message indicates email and password required", function () {
          const json = pm.response.json();
          pm.expect(json.error || json.message).to.include("Email and password required");
      });
