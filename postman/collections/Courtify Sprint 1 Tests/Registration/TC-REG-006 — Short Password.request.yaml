$kind: http-request
name: 'TC-REG-006 — Short Password'
method: POST
url: '{{base_url}}/auth/signup'
order: 6000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Short Pass User",
      "email": "shortpass@example.com",
      "password": "123",
      "userType": "player"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-REG-006: Status is 400", () => pm.response.to.have.status(400));
      pm.test("TC-REG-006: Response contains password length error", () => {
          const body = pm.response.text();
          pm.expect(body).to.match(/password.*short|password.*length|minimum.*character/i);
      });
