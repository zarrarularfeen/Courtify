$kind: http-request
name: 'TC-REG-007 — Invalid userType'
method: POST
url: '{{base_url}}/auth/signup'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Bad Type User",
      "email": "badtype@example.com",
      "password": "12345678",
      "userType": "superadmin"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-REG-007: Status is 400", () => pm.response.to.have.status(400));
      pm.test("TC-REG-007: Response contains invalid userType error", () => {
          const body = pm.response.text();
          pm.expect(body).to.match(/invalid.*userType|userType.*invalid|invalid.*user.*type/i);
      });
