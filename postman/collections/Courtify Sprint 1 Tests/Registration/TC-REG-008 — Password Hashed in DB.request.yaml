$kind: http-request
name: 'TC-REG-008 — Password Hashed in DB'
method: POST
url: '{{base_url}}/auth/signup'
order: 8000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Hash Test User",
      "email": "hashtest_{{$timestamp}}@example.com",
      "password": "12345678",
      "userType": "player"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-REG-008: Status is 201", () => pm.response.to.have.status(201));
      pm.test("TC-REG-008: Response does not expose plain password", () => {
          const body = pm.response.text();
          pm.expect(body).to.not.include("12345678");
      });
      pm.test("TC-REG-008: Response does not expose password_hash field", () => {
          const body = pm.response.text();
          pm.expect(body).to.not.include("password_hash");
      });
