$kind: http-request
name: 'TC-REG-003 — Duplicate Player Email'
method: POST
url: '{{base_url}}/auth/signup'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "newplayer@test.com",
      "password": "AnyPass123",
      "userType": "player"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-REG-003: Status is 409 Conflict", function () {
          pm.response.to.have.status(409);
      });
      pm.test("TC-REG-003: Error message indicates duplicate email", function () {
          const json = pm.response.json();
          pm.expect(json.error || json.message).to.include("Email already registered");
      });
