$kind: http-request
name: 'TC-REG-009 — Password Stored as Bcrypt Hash'
method: POST
url: '{{base_url}}/auth/signup'
order: 9000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "Hash Check",
      "email": "checkpass_{{$timestamp}}@test.com",
      "password": "PlainPass99",
      "userType": "player"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-REG-009: Status is 201 Created (registration succeeds)", function () {
          pm.response.to.have.status(201);
      });
      pm.test("TC-REG-009: Response does NOT expose password_hash field", function () {
          const json = pm.response.json();
          pm.expect(json).to.not.have.property("password_hash");
          pm.expect(json).to.not.have.property("password");
      });
      pm.test("TC-REG-009: NOTE — Verify in DB: password_hash starts with $2b$10$ (bcrypt, 10 salt rounds)", function () {
          // Manual DB check: SELECT password_hash FROM players WHERE email='checkpass@test.com'
          // Expected: starts with '$2b$10$', NOT equal to 'PlainPass99'
          pm.expect(true).to.be.true;
      });
