$kind: http-request
name: 'TC-LOG-001 — Valid Player Login'
method: POST
url: '{{base_url}}/auth/login'
order: 1000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "player@test.com",
      "password": "Pass@1234"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-LOG-001: Valid verified player login returns 200 with JWT token
      pm.test("TC-LOG-001: Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("TC-LOG-001: Response contains JWT token", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("token");
          pm.expect(json.token).to.be.a("string").and.not.empty;
      });

      pm.test("TC-LOG-001: Response contains user object", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("user");
      });

      pm.test("TC-LOG-001: User type is player", function () {
          const json = pm.response.json();
          pm.expect(json.user.userType).to.equal("player");
      });

      // Save token for downstream requests
      if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.collectionVariables.set("player_token", json.token);
          console.log("TC-LOG-001: Player token saved to collection variable 'player_token'");
      }
