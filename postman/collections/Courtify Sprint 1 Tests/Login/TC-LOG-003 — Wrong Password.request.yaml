$kind: http-request
name: 'TC-LOG-003 — Wrong Password'
method: POST
url: '{{base_url}}/auth/login'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "player@test.com",
      "password": "WrongPassword!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-LOG-003: Login with wrong password returns 401 Unauthorized
      pm.test("TC-LOG-003: Status is 401 Unauthorized", function () {
          pm.response.to.have.status(401);
      });

      pm.test("TC-LOG-003: Error message indicates invalid credentials", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
          const msg = json.message.toLowerCase();
          pm.expect(msg).to.satisfy(function(m) {
              return m.includes("invalid") || m.includes("incorrect") || m.includes("wrong") || m.includes("credentials");
          }, "Expected error message about invalid credentials");
      });

      pm.test("TC-LOG-003: No token returned on failed login", function () {
          const json = pm.response.json();
          pm.expect(json).to.not.have.property("token");
      });
