$kind: http-request
name: 'TC-LOG-008 — No Password Hash in Response'
method: GET
url: 'http://localhost:5000/auth/validate'
order: 8000
queryParams:
  - key: email
    value: player@example.com
  - key: password
    value: '12345678'
  - key: userType
    value: player
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-LOG-008: Status is 200", () => pm.response.to.have.status(200));
      pm.test("TC-LOG-008: Response does not contain password_hash", () => {
          const body = pm.response.text();
          pm.expect(body).to.not.include("password_hash");
          pm.expect(body).to.not.include("password");
      });
      pm.test("TC-LOG-008: Response contains expected safe fields", () => {
          const json = pm.response.json();
          pm.expect(json).to.have.property("email");
          pm.expect(json).to.have.property("userType");
      });
