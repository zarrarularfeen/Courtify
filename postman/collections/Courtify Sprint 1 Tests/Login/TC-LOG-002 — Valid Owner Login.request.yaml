$kind: http-request
name: 'TC-LOG-002 — Valid Owner Login'
method: POST
url: '{{base_url}}/auth/login'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "owner@test.com",
      "password": "Pass@1234"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-LOG-002: Valid verified owner login returns 200 with JWT token
      pm.test("TC-LOG-002: Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("TC-LOG-002: Response contains JWT token", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("token");
          pm.expect(json.token).to.be.a("string").and.not.empty;
      });

      pm.test("TC-LOG-002: User type is owner", function () {
          const json = pm.response.json();
          pm.expect(json.user.userType).to.equal("owner");
      });

      // Save owner token for downstream requests
      if (pm.response.code === 200) {
          const json = pm.response.json();
          pm.collectionVariables.set("owner_token", json.token);
          console.log("TC-LOG-002: Owner token saved to collection variable 'owner_token'");
      }
