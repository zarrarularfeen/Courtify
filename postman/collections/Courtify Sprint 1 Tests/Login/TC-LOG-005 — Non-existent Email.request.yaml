$kind: http-request
name: 'TC-LOG-005 — Non-existent Email'
method: GET
url: '{{base_url}}/auth/validate'
order: 5000
queryParams:
  - key: email
    value: ghost@nowhere.com
  - key: password
    value: AnyPass123
  - key: userType
    value: player
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-LOG-005: Status is 401", () => pm.response.to.have.status(401));
      pm.test("TC-LOG-005: Invalid email or password error", () => {
          const body = pm.response.text();
          pm.expect(body).to.include("Invalid email or password");
      });
