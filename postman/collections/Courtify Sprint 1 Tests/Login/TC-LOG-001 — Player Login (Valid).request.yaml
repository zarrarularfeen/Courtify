$kind: http-request
name: 'TC-LOG-001 — Player Login (Valid)'
method: GET
url: '{{base_url}}/auth/validate'
order: 1000
queryParams:
  - key: email
    value: player@example.com
  - key: password
    value: '12345678'
  - key: userType
    value: player
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-LOG-001: Status is 200", () => pm.response.to.have.status(200));
      pm.test("TC-LOG-001: Response contains authenticated", () => {
          const json = pm.response.json();
          pm.expect(json).to.have.property("authenticated");
      });
      pm.test("TC-LOG-001: Response contains userId", () => {
          const json = pm.response.json();
          pm.expect(json).to.have.property("userId");
      });
