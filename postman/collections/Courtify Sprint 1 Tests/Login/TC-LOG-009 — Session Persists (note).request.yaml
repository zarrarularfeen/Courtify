$kind: http-request
name: 'TC-LOG-009 — Session Persists (note)'
method: GET
url: 'http://localhost:5000/auth/validate'
order: 9000
description: 'TC-LOG-009: This test verifies session persistence on page refresh — a frontend/browser test. Run this request to confirm the API returns valid session data, then manually refresh the browser to verify the session is maintained.'
queryParams:
  - key: email
    value: player@example.com
  - key: password
    value: '12345678'
  - key: userType
    value: player
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-LOG-009: Status is 200 (session data available)", () => pm.response.to.have.status(200));
