$kind: http-request
name: 'TC-LOG-004 — Wrong Password'
method: GET
url: '{{base_url}}/auth/validate'
order: 4000
queryParams:
  - key: email
    value: player@example.com
  - key: password
    value: wrongpass
  - key: userType
    value: player
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("TC-LOG-004: Status is 401", () => pm.response.to.have.status(401));
      pm.test("TC-LOG-004: Invalid email or password error", () => {
          const body = pm.response.text();
          pm.expect(body).to.include("Invalid email or password");
      });
