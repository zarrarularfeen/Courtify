$kind: http-request
name: 'TC-LOG-007 — Missing Password Field'
method: POST
url: '{{base_url}}/auth/login'
order: 7000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "player@test.com"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-LOG-007: Login with missing password field returns 400 Bad Request
      pm.test("TC-LOG-007: Status is 400 Bad Request", function () {
          pm.response.to.have.status(400);
      });

      pm.test("TC-LOG-007: Error message indicates missing password", function () {
          const json = pm.response.json();
          pm.expect(json).to.have.property("message");
          pm.expect(json.error || json.message).to.be.a("string").and.not.empty;
      });

      pm.test("TC-LOG-007: No token returned on validation error", function () {
          const json = pm.response.json();
          pm.expect(json).to.not.have.property("token");
      });
