$kind: http-request
name: 'TC-LOG-009 — Token Stored in localStorage (Frontend)'
method: POST
url: '{{base_url}}/auth/login'
order: 9000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "email": "player@test.com",
      "password": "Pass@1234",
      "userType": "player"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-LOG-009: After login, JWT token is stored in browser localStorage.
      // localStorage is browser-only and cannot be automated via Postman.
      // This test confirms the API returns a token in the response (backend side).
      // Manual step: Open http://localhost:5173/login, log in, then check
      // DevTools → Application → Local Storage for key "token".

      pm.test("TC-LOG-009: Login returns 200 and token (backend check)", function () {
          pm.response.to.have.status(200);
          const json = pm.response.json();
          pm.expect(json).to.have.property("token");
          // Save token to collection variable for subsequent tests
          pm.collectionVariables.set("player_token", json.token);
      });

      pm.test("TC-LOG-009: MANUAL — Verify localStorage 'token' key in browser DevTools", function () {
          // Always passes — perform manual check in browser as described above.
          pm.expect(true).to.be.true;
      });

      console.log("TC-LOG-009: Manual step — open http://localhost:5173/login in browser and check localStorage.token");
