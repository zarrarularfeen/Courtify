$kind: http-request
name: 'TC-LOG-009 — Token Stored in localStorage (Frontend)'
method: GET
url: '{{frontend_url}}/login'
order: 9000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      // TC-LOG-009: After login, JWT token is stored in browser localStorage
      // This request loads the frontend login page to confirm it is accessible.
      // The actual localStorage check must be done in the browser DevTools.
      pm.test("TC-LOG-009: Frontend login page loads (200 OK)", function () {
          pm.response.to.have.status(200);
      });

      pm.test("TC-LOG-009: Response is HTML (frontend served)", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("text/html");
      });

      // Manual verification steps:
      // 1. Open http://localhost:5173/login in browser
      // 2. Submit valid credentials (player@test.com / Pass@1234)
      // 3. Open DevTools → Application → Local Storage → http://localhost:5173
      // 4. Confirm key "token" exists with a valid JWT value
      console.log("TC-LOG-009: Manual step — after login, check localStorage 'token' key in browser DevTools");
